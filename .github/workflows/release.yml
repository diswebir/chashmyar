name: Build Windows release draft

# A stable, matching vX.Y.Z tag is required. The workflow never publishes it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Rust dependency cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Verify tag and all version fields
        run: node scripts/version.mjs check --tag "$env:RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Install dependencies
        run: npm ci
      - name: Test pure Rust logic
        run: npm run test:logic
      - name: Test old-record compatibility
        run: npm run test:compat
      - name: Test release scripts without GitHub access
        run: npm run test:release
      - name: Build installer and portable executable
        run: npm run build:win
      - name: Verify PE files
        run: npm run verify:exe
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser and mock-IPC suites
        run: npm run test:ui:all
      - name: Generate Windows-target third-party notices
        run: npm run licenses:generate
      - name: Stage assets and SHA-256 manifest
        run: node scripts/stage-release.mjs --tag "$env:RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Upload verified build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: chashmyar-windows-x64
          path: release/staging/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create or update a draft only
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: chashmyar-windows-x64
          path: release/staging
      - name: Verify and create or update draft
        run: node scripts/create-draft-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
