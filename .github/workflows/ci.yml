name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Frontend, logic and release-tool checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install dependencies
        run: npm ci
      - name: Check version consistency
        run: npm run version:check
      - name: Check branding assets and Windows icon frames
        run: npm run test:branding
      - name: Check local documentation links
        run: npm run test:docs
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build
      - name: Test pure Rust logic
        run: npm run test:logic
      - name: Verify Windows focus and overlay source policy
        run: npm run test:windows-policy
      - name: Verify filter and persistence stability wiring
        run: npm run test:stability-policy
      - name: Test record compatibility
        run: npm run test:compat
      - name: Test release safety (offline GitHub simulation)
        run: npm run test:release
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and mock-IPC suites
        run: npm run test:ui:all

  # Independent jobs let browser checks finish even when an updated dependency
  # requires a notice refresh, and let the candidate be generated even when
  # another check fails. Both jobs are read-only and receive no release secrets.
  notices:
    name: Third-party license notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install dependencies for inventory
        run: npm ci --ignore-scripts
      - name: Verify third-party notices
        id: notices
        run: npm run licenses:check
      # Do not auto-commit or grant Dependabot/fork PRs write permissions.
      # A maintainer must review the license changes and include the file.
      - name: Generate candidate notices for review
        id: notice_candidate
        if: failure() && steps.notices.outcome == 'failure' && github.event_name == 'pull_request'
        run: npm run licenses:generate
      - name: Attach candidate notices (check remains failed)
        if: failure() && steps.notices.outcome == 'failure' && steps.notice_candidate.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate-third-party-notices-${{ github.run_id }}-${{ github.run_attempt }}
          path: THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 7
