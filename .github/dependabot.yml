version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Vite 8 and plugin-react 6 require each other; independent major bumps
    # fail npm ci with ERESOLVE. Group for review; CI must still pass.
    groups:
      vite-react-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
    # Tailwind 4 requires a separate PostCSS/CSS migration and visual review.
    # Continue receiving v3 minor/patch and security information; do not merge
    # the incompatible major mechanically. Revisit this after migration.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /tests/rust-compat
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    # The production payload audit and its real host regression test must use
    # the same sha2 version. Group compatible version updates across both
    # directories; security updates may still need a maintainer to sync them.
    groups:
      shared-sha2:
        group-by: dependency-name
        patterns:
          - "sha2"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
