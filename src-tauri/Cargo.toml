[package]
name = "chashmyar"
version = "2.4.4"
description = "ChashmYar — eye-care, screen dimmer and strict Pomodoro for Windows"
authors = ["Reza Jantrani and ChashmYar contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "chashmyar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_ColorSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_LibraryLoader",
] }
window-vibrancy = "0.6"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
panic = "unwind"
strip = true

# Local Apache-2.0 Tao patch: passive Windows shows without stealing focus.
# See vendor/tao/CHASHMYAR_PATCH.md and THIRD_PARTY_NOTICES.txt.
[patch.crates-io]
tao = { path = "vendor/tao" }
